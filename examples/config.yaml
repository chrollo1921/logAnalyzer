# Example settings file: sapcx-log-analyzer analyze export.csv --config examples/config.yaml
# Environment variables (SAPCX_LA_<NAME>) override these values; CLI flags override both.
# Keys are never read from here: put LITELLM_BASE_URL and LITELLM_API_KEY (or ANTHROPIC_API_KEY)
# in the environment or a .env file. See .env.example.

model: claude-opus-5-5    # or the model name your LiteLLM proxy uses
effort: high              # low | medium | high | xhigh | max
max_output_tokens: 16000
use_refusal_fallback: true

min_level: WARN           # records below this are ignored unless a rule says any_level
samples_per_cluster: 3
timeline_bucket_minutes: 5

max_chars_per_batch: 80000
max_clusters_for_llm: 150

extra_rules_file: examples/project_rules.yaml

extra_redaction_patterns:
  - name: customer_number
    pattern: "\\bCUST-\\d{6,}\\b"
    replacement: "<CUSTOMER>"
    # Optional: only try the pattern on lines that contain one of these strings (any case),
    # which keeps loading large exports fast.
    hints: ["cust-"]

# Web chat (`serve`). Keep the access key out of this file: set SAPCX_LA_SERVER_ACCESS_TOKEN.
server_auth: token
server_allowed_hosts: ["logs.example.com"]
server_max_upload_mb: 100
server_max_uploads_per_user: 5
server_max_uploads: 30
server_upload_idle_hours: 8
server_max_concurrent_questions: 4
